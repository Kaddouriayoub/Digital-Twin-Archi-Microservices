# ─────────────────────────────────────────────────────────────
# Digital Twin + HotROD (Jaeger's 4-service demo)
# Usage: docker compose -f docker-compose-hotrod.yml up --build
# ─────────────────────────────────────────────────────────────

services:

  # ── Jaeger v2 (all-in-one with spanmetrics → Prometheus) ──
  jaeger:
    image: jaegertracing/jaeger:latest
    volumes:
      - "./config/jaeger-spm.yaml:/etc/jaeger/config.yml"
    command: ["--config", "/etc/jaeger/config.yml"]
    environment:
      - SPANMETRICS_FLUSH_INTERVAL=15s
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks:
      backend:
        aliases: [spm_metrics_source]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── HotROD demo app (4 microservices) ─────────────────────
  hotrod:
    image: jaegertracing/example-hotrod:latest
    ports:
      - "8080:8080"
      - "8083:8083"
    command: ["all"]
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    networks:
      - backend
    depends_on:
      jaeger:
        condition: service_healthy

  # ── Prometheus (scrapes spanmetrics from Jaeger) ──────────
  prometheus:
    image: prom/prometheus:v3.12.0
    volumes:
      - "./config/prometheus-hotrod.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - backend
    depends_on:
      jaeger:
        condition: service_healthy

  # ── Kafka (Digital Thread) ────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: dt-kafka-hotrod
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "digital-twin-hotrod-cluster"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Digital Twin Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dt-backend-hotrod
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - PROMETHEUS_URL=http://prometheus:9090
      - JAEGER_URL=http://jaeger:16686
      - KAFKA_BROKERS=kafka:9092
      - SCRAPE_INTERVAL_MS=15000
      - DEMO_MODE=false
      - DT_DRY_RUN=true
      - METRICS_SOURCE=spanmetrics
      - ML_SERVICE_URL=http://ml-service:8001
    depends_on:
      kafka:
        condition: service_healthy
      prometheus:
        condition: service_started
      ml-service:
        condition: service_started
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── ML Service (Isolation Forest) ─────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: dt-ml-hotrod
    ports:
      - "8001:8001"
    networks:
      - backend

  # ── Digital Twin Frontend ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dt-frontend-hotrod
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:3001/api
      - VITE_WS_URL=ws://localhost:3001/ws
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
