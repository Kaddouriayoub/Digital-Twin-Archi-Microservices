# ─────────────────────────────────────────────────────────────
# Digital Twin — connects to Sock Shop's network
# 
# Step 1: Start Sock Shop + monitoring
#   cd /path/to/microservices-demo/deploy/docker-compose
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Step 2: Start Digital Twin
#   cd /path/to/digital-twin-microservices
#   docker compose -f docker-compose-sockshop.yml up --build
# ─────────────────────────────────────────────────────────────

services:

  # ── Kafka (Digital Thread) ────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: dt-kafka-sockshop
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "digital-twin-sockshop-cluster"
    networks:
      - sock-shop
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Digital Twin Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dt-backend-sockshop
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - PROMETHEUS_URL=http://prometheus:9090
      - KAFKA_BROKERS=kafka:9092
      - SCRAPE_INTERVAL_MS=15000
      - DEMO_MODE=false
      - DT_DRY_RUN=true
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - sock-shop
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Digital Twin Frontend ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dt-frontend-sockshop
    ports:
      - "3002:80"
    environment:
      - VITE_API_URL=http://localhost:3001/api
      - VITE_WS_URL=ws://localhost:3001/ws
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sock-shop

networks:
  sock-shop:
    external: true
